                name: Mehmet
                basis:
                  counted_sources:
                  - ssa
                  - ons
                  - insee
                  - statcan
                  - ine
                  - cso
                  - ssb
                  counted_countries: 5
                  attested_countries: 14
                  note: Shares are calculated only across countries that publish counted birth registration statistics…
                registrations:
                - country: FR
                  count: 3775
                  share: 58.97
                  gender: male
                  probability: 99
                  source: insee
                - country: GB
                  count: 1130
                  share: 17.65
                  gender: male
                  probability: 99
                  source: ons
                attested_in:
                - AL
                - AU
                - BE
                - CA
                - CH
                - ES
                - FR
                - GB
                - MK
                - 'NO'
                - SE
                - TR
                - US
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /api/v1/gender/email:
