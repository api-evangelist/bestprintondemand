openapi: 3.2.0
info:
  title: NameGender Gender API
  version: 1.0.0
  summary: Infer gender from names, emails and usernames, with the evidence behind each answer.
  description: Every lookup endpoint accepts both GET and POST so it can be called from a browser, a shell or a server.
  contact:
    url: https://namegender.com/docs
servers:
- url: https://namegender.com
  description: Production
security:
- bearerAuth: []
- apiKeyHeader: []
tags:
- name: Gender
  description: Name, email and username lookups.
paths:
  /api/v1/gender:
    get:
      tags:
      - Gender
      summary: Gender from a name
      description: Pass a full name or a first name. Titles, punctuation and surnames are stripped before lookup; `name` in the response shows what was actually looked up.
      operationId: getName
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
        description: The value to resolve.
        example: Ayşe Yılmaz
      - name: country
        in: query
        required: false
        schema:
          type: string
          minLength: 2
          maxLength: 2
        description: 'ISO-3166 alpha-2 code. Narrows the lookup to one country, which matters for names that flip gender across borders: Andrea is male in Italy and female in Germany. Omit it and the answer is the worldwide aggregate.'
        example: TR
      - name: locale
        in: query
        required: false
        schema:
          type: string
          maxLength: 35
        description: 'A language tag such as `de-DE`, `en_US` or `pt_BR.UTF-8`, typically the browser''s `navigator.language` or the `Accept-Language` header of your sign-up form. Its region becomes the country when `country` is not sent. A tag without a region (`en`, `de`) sets no country: a language alone does not say which country it is spoken in. `country_source` in the response tells you which one was used.'
        example: it-IT
      - name: ip
        in: query
        required: false
        schema:
          type: string
          maxLength: 45
        description: The end user's IP address (IPv4 or IPv6), for example from your sign-up request. Its country is used when neither `country` nor a `locale` with a region is sent. Private and reserved ranges are ignored. The address is used for this lookup only and is not stored. IP geolocation by DB-IP (db-ip.com), CC BY 4.0.
        example: 93.42.0.1
      - name: ai_fallback
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: 'Ask a language model when the dataset has no answer. Slower and less certain; the response reports `source: "llm"` so you can tell these apart. Requires AI lookups to be enabled in account settings; otherwise the call fails with `ai_consent_required`.'
      - name: best_guess
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Return the most likely gender even below the confidence threshold, instead of null. Check `probability` before trusting the result.
      responses:
        '200':
          description: Resolved. `gender` is null when the name is not recognised — that is a successful answer of "we do not know", not an error, and it still costs one credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
              examples:
                known:
                  $ref: '#/components/examples/known'
                unknown:
                  $ref: '#/components/examples/unknown'
                fuzzy:
                  $ref: '#/components/examples/fuzzy'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      tags:
      - Gender
      summary: Gender from a name
      description: Pass a full name or a first name. Titles, punctuation and surnames are stripped before lookup; `name` in the response shows what was actually looked up.
      operationId: postName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 200
                country:
                  type: string
                  minLength: 2
                  maxLength: 2
                locale:
                  type: string
                  maxLength: 35
                ip:
                  type: string
                  maxLength: 45
                ai_fallback:
                  type: boolean
                  default: false
                best_guess:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Resolved. `gender` is null when the name is not recognised — that is a successful answer of "we do not know", not an error, and it still costs one credit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleResponse'
              examples:
                known:
                  $ref: '#/components/examples/known'
                unknown:
                  $ref: '#/components/examples/unknown'
                fuzzy:
                  $ref: '#/components/examples/fuzzy'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /api/v1/gender/bulk:
    post:
      tags:
      - Gender
      summary: Resolve many names in one request
      description: 'Exists so that 100 names do not cost 100 HTTP round trips. Names are resolved in a single batch lookup. Credits are checked for the whole batch up front: either every name is processed or none is.'
      operationId: bulkGender
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkRequest'
      responses:
        '200':
          description: Every name resolved. Results are returned in the order they were sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkResponse'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
  /api/v1/gender/countries:
    get:
      tags:
      - Gender
      summary: Which countries a name is recorded in
      description: 'This is not a "country of origin" lookup, and it is deliberately not named like one: the data cannot support that claim, and the difference is measurable.


        Counted birth-registration statistics exist for seven countries only: the US, UK, France, Canada, Spain, Ireland and Norway. Everything else is presence data — it says a name occurs in a country, not how many people carry it. So a query for `Mehmet` ranks France first at 59%, and Turkey does not appear in the ranking at all, because Turkey publishes no counts.


        The response therefore keeps the two apart. `registrations` is measured volume and is comparable, but only among the counting countries. `attested_in` is presence, and that is where Turkey, Japan and India show up. Neither field is a claim about any person''s origin or ethnicity.


        **Credits.** One credit per request. `ai_fallback` and `best_guess` do not apply here and are ignored.'
      operationId: getCountries
      parameters:
      - name: name
        in: query
        required: true
        description: The first name to look up.
        schema:
          type: string
          maxLength: 200
        example: Mehmet
      - name: limit
        in: query
        required: false
        description: How many counted countries to list in `registrations`. Shares and `basis.counted_countries` are not affected, and `attested_in` is never cut.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      responses:
        '200':
          description: Country distribution, with the basis of the numbers stated in the response itself.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesResponse'
              example:
                credits_charged: 1
                credits_remaining: 49999
                data_version: '2026.08'
                request_id: req_6b2d90e14fa37c58
                took_ms: 3
                name: Mehmet
                basis:
                  counted_sources:
                  - ssa
                  - ons
                  - insee
                  - statcan
                  - ine
                  - cso
                  - ssb
                  counted_countries: 5
                  attested_countries: 14
                  note: Shares are calculated only across countries that publish counted birth registration statistics…
                registrations:
                - country: FR
                  count: 3775
                  share: 58.97
                  gender: male
                  probability: 99
                  source: insee
                - country: GB
                  count: 1130
                  share: 17.65
                  gender: male
                  probability: 99
                  source: ons
                attested_in:
                - AL
                - AU
                - BE
                - CA
                - CH
                - ES
                - FR
                - GB
                - MK
                - 'NO'
                - SE
                - TR
                - US
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '402':
          $ref: '#/components/responses/402'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
    post:
      tags:
      - Gender
      summary: Which countries a name is recorded in
      description: 'This is not a "country of origin" lookup, and it is deliberately not named like one: the data cannot support that claim, and the difference is measurable.


        Counted birth-registration statistics exist for seven countries only: the US, UK, France, Canada, Spain, Ireland and Norway. Everything else is presence data — it says a name occurs in a country, not how many people carry it. So a query for `Mehmet` ranks France first at 59%, and Turkey does not appear in the ranking at all, because Turkey publishes no counts.


        The response therefore keeps the two apart. `registrations` is measured volume and is comparable, but only among the counting countries. `attested_in` is presence, and that is where Turkey, Japan and India show up. Neither field is a claim about any person''s origin or ethnicity.


        **Credits.** One credit per request. `ai_fallback` and `best_guess` do not apply here and are ignored.'
      operationId: postCountries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 200
                  example: Mehmet
                  description: The first name to look up.
