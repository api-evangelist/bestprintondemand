components:
  examples:
    unknown:
      summary: Name not in the dataset — a successful "we do not know"
      value:
        credits_charged: 1
        credits_remaining: 4820
        data_version: '2026.08'
        request_id: req_1d7e3c9048ba52f6
        query: Qzzxvv
        name: Qzzxvv
        first_name: Qzzxvv
        middle_name: null
        last_name: null
        name_type: personal
        gender: null
        country: null
        sample_size: 0
        probability: 0
        took_ms: 1
        source: none
        confidence: unknown
        matched_as: null
    fuzzy:
      summary: Resolved by closest spelling — note the capped probability
      value:
        credits_charged: 1
        credits_remaining: 4819
        data_version: '2026.08'
        request_id: req_44a0be71c3925fd8
        query: Micheal
        name: Micheal
        first_name: Micheal
        middle_name: null
        last_name: null
        name_type: personal
        gender: male
        country: null
        sample_size: 152388
        probability: 86
        took_ms: 2
        source: fuzzy
        confidence: high
        matched_as: michael
    known:
      summary: Recognised name
      value:
        credits_charged: 1
        credits_remaining: 4821
        data_version: '2026.08'
        request_id: req_9c1f5b2a7e0d4a13
        query: Ayşe Yılmaz
        name: Ayşe
        first_name: Ayşe
        middle_name: null
        last_name: Yılmaz
        name_type: personal
        gender: female
        country: null
        sample_size: 655
        probability: 99
        took_ms: 1
        source: db
        confidence: high
        matched_as: null
  schemas:
    BulkRequest:
      type: object
      required:
      - names
      properties:
        names:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            maxLength: 200
          description: The values to resolve, each at most 200 characters. Each one costs one credit.
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO-3166 alpha-2 code applied to every value in the batch.
        locale:
          type: string
          maxLength: 35
          description: Language tag whose region becomes the batch country when `country` is not sent, for example `it-IT`. A tag without a region sets no country.
        ip:
          type: string
          maxLength: 45
          description: End user IP address whose country becomes the batch country when neither `country` nor a regional `locale` is sent. Not stored. IP geolocation by DB-IP (db-ip.com), CC BY 4.0.
        type:
          type: string
          enum:
          - name
          - email
          - username
          default: name
          description: How to read the values in `names`.
        ai_fallback:
          type: boolean
          default: false
          description: Ask a language model for values the dataset cannot answer. Requires AI lookups to be enabled in account settings; otherwise the batch fails with `ai_consent_required`.
        best_guess:
          type: boolean
          default: false
          description: Return the most likely gender even below the confidence threshold, instead of null. For `email` and `username` batches it applies to the extracted first name.
      example:
        names:
        - Ayşe
        - Mehmet
        - Andrea
        country: TR
    Error:
      type: object
      description: The one error shape. Returned by every endpoint at every failing status code.
      required:
      - error
      - message
      - docs
      properties:
        error:
          type: string
          description: Machine-readable and stable. **Branch on this.** New codes may be added over time, so treat an unrecognised value as a generic failure rather than crashing.
          enum:
          - missing_key
          - invalid_key
          - revoked_key
          - blocked
          - email_not_verified
          - ip_not_allowed
          - proxy_secret_required
          - forbidden
          - no_credits
          - missing_input
          - invalid_input
          - too_many_items
          - ai_consent_required
          - unknown_endpoint
          - method_not_allowed
          - payload_too_large
          - rate_limited
          - batch_not_found
          - batch_not_startable
          - batch_not_finished
          - batch_in_progress
          - result_gone
          - too_many_batches
          - not_ready
          - server_error
        message:
          type: string
          description: Human-readable, translated into the caller's language. Wording can change; never parse or compare it.
        request_id:
          type:
          - string
          - 'null'
          description: Quote this in support requests.
          example: req_9c1f5b2a7e0d4a13
        docs:
          type: string
          format: uri
          description: Link to this error in the documentation.
        errors:
          type: object
          description: Field-level detail. Present on validation failures only.
          additionalProperties:
            type: array
            items:
              type: string
        retry_after:
          type: integer
          description: Seconds to wait. Present on 429 only, and mirrored in the `Retry-After` header.
    GenderResult:
      type: object
      required:
      - query
      - name
      - gender
      - probability
      - sample_size
      - source
      properties:
        query:
          type: string
          description: The input exactly as you sent it.
        name:
          type:
          - string
          - 'null'
          description: The first name actually looked up, after stripping titles and surnames.
        first_name:
          type:
          - string
          - 'null'
          description: Given name parsed from the input. Present even when `gender` is null, and not charged separately. Titles and initials are never returned. For Chinese, Korean and Japanese script the surname comes first in the input and is returned in `last_name`.
        middle_name:
          type:
          - string
          - 'null'
          description: Any further given names between the first name and the surname, for example "Fitzgerald" in "John Fitzgerald Kennedy". Initials are dropped.
        last_name:
          type:
          - string
          - 'null'
          description: Surname parsed from the input, including particles such as "van" or "de la". "Smith, John" is read as surname first. With a Spanish-speaking `country` the last two words are both surnames (Pérez García). Always null for usernames, where a surname cannot be told apart from any other word.
        name_type:
          type:
          - string
          - 'null'
          enum:
          - personal
          - organization
          - role
          - null
          description: '`organization` when the input carries a company marker (Acme LLC, Müller GmbH, Stanford University); `role` for shared mailboxes and placeholder accounts (info@, Customer Service, guest). Both return `gender: null` and no name parts. `personal` means no such marker was found; it does not confirm the input is a real name. null when the input is not a name at all.'
        gender:
          type:
          - string
          - 'null'
          enum:
          - male
          - female
          - null
          description: null means the dataset has no confident answer. This is not an error.
        probability:
          type: integer
          minimum: 0
          maximum: 100
          description: Share of people with this name who have the reported gender. 0 when unknown. Measured against held-out data, answers at 80+ come true about 95% of the time, so this number runs slightly conservative rather than optimistic.
        sample_size:
          type: integer
          description: How many real people the answer is based on. A probability of 100 from a sample of 3 is weaker than 85 from a sample of 90,000 — read the two fields together. 0 means the source recorded proportions rather than counts.
        country:
          type:
          - string
          - 'null'
          description: The country the answer came from, when narrowed.
        took_ms:
          type: integer
          example: 1
          description: Whole milliseconds spent resolving this value on our side; network time is not included.
        source:
          type: string
          enum:
          - db
          - script
          - fuzzy
          - llm
          - cache
          - none
          description: How the answer was reached. `db` exact match; `script` matched after transliterating a non-Latin script; `fuzzy` closest spelling; `llm` language model; `none` no answer. Use it to decide how much to trust a row.
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
          - unverified
          - unknown
          description: 'Sample size bucket: high ≥100 people, medium ≥25, low ≥1, unverified when the source gave proportions instead of counts.'
        matched_as:
          type:
          - string
          - 'null'
          description: For `fuzzy` and `script` sources, the dictionary entry that was actually matched. Always inspect this before accepting a fuzzy result.
    BulkResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        required:
        - results
        - summary
        properties:
          took_ms:
            type: integer
            example: 12
            description: Whole milliseconds spent resolving the batch on our side, network time excluded.
          country_source:
            type:
            - string
            - 'null'
            enum:
            - country
            - locale
            - ip
            - null
            description: 'Where the country came from: the `country` parameter, the region of `locale`, the `ip` address, or none of them (null, worldwide answer).'
          summary:
            type: object
            description: Counts for the whole batch.
            properties:
              total:
                type: integer
                description: Values sent.
              identified:
                type: integer
                description: Values with a non-null `gender`.
              unknown:
                type: integer
                description: 'Values with `gender: null`.'
              match_rate:
                type: number
                description: Percentage identified.
          results:
            type: array
            description: Same order as the names you sent.
            items:
              $ref: '#/components/schemas/GenderResult'
    Envelope:
      type: object
      required:
      - credits_charged
      - credits_remaining
      properties:
        credits_charged:
          type: integer
          description: 'How many credits this call took from the balance: one per value resolved.'
        credits_remaining:
          type: integer
          description: 'Balance once this call is paid for: purchased credits plus whatever is left of today''s free quota.'
        data_version:
          type:
          - string
          - 'null'
          example: '2026.08'
          description: Name-dataset snapshot that produced the answer.
        request_id:
          type:
          - string
          - 'null'
          description: Identifier of this call, also sent as the `X-Request-Id` header. Quote it in support requests.
    SingleResponse:
      allOf:
      - $ref: '#/components/schemas/Envelope'
      - type: object
        properties:
          country_source:
            type:
            - string
            - 'null'
            enum:
            - country
            - locale
            - ip
            - null
            description: 'Where the country came from: the `country` parameter, the region of `locale`, the `ip` address, or none of them (null, worldwide answer).'
      - $ref: '#/components/schemas/GenderResult'
    CountriesResponse:
      type: object
      description: Two lists, deliberately not merged. `registrations` is measured volume and is comparable only among countries that publish counts. `attested_in` is presence, with no weight attached — a country appears there whether or not anyone counted it.
      properties:
        credits_charged:
          type: integer
          description: 'How many credits this call took from the balance: always 1.'
        credits_remaining:
          type: integer
          description: Balance once this call is paid for.
        data_version:
          type: string
          nullable: true
          description: Name-dataset snapshot that produced the answer.
        request_id:
          type:
          - string
          - 'null'
          description: Identifier of this call, also sent as the `X-Request-Id` header. Quote it in support requests.
        took_ms:
          type: integer
          example: 3
          description: Whole milliseconds spent building the distribution on our side, network time excluded.
        name:
          type: string
          description: The name that was looked up.
        basis:
          type: object
          description: What the numbers rest on. Carried in the response rather than left to the documentation, because the person reading a percentage is not reading the docs.
          properties:
            counted_sources:
              type: array
              items:
                type: string
              description: The statistical offices that publish observation counts.
            counted_countries:
              type: integer
              description: Countries with counted registrations for this name, before `limit` is applied. Can be larger than the length of `registrations`.
            attested_countries:
              type: integer
              description: Countries in `attested_in`, which `limit` never cuts.
            note:
              type: string
              description: Plain-language caveat. Show it next to the percentages.
        registrations:
          type: array
          description: Countries with counted registrations, most first, cut to `limit`. Shares are calculated across every counted country before the cut, so they sum to 100 only when nothing is cut.
          items:
            type: object
            properties:
              country:
                type: string
                description: ISO 3166-1 alpha-2.
              count:
                type: integer
                description: Observed registrations.
              share:
                type: number
                format: float
                description: This country's percentage of the name's registrations across all counting countries, including any that `limit` cut from the list.
              gender:
                type: string
                nullable: true
                description: Majority gender for the name in this country.
              probability:
                type: integer
                description: Share, 0–100, carrying that gender in this country.
              source:
                type: string
                description: Statistical office the count comes from.
        attested_in:
          type: array
          items:
            type: string
          description: Every country the name occurs in, counted or not, alphabetically.
  responses:
    '500':
      description: Unexpected server error. Nothing was charged. Quote `request_id` if it persists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '401':
      description: 'No usable API key. Codes: `missing_key`, `invalid_key`, `revoked_key`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '400':
      description: 'Bad request. Codes: `missing_input`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '422':
      description: 'Input failed validation. `errors` names the offending fields. Codes: `invalid_input`, `too_many_items`, `ai_consent_required`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '402':
      description: Out of credits. Buy more, or wait for the daily free quota to reset at midnight UTC.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    '429':
      description: 'Rate limit exceeded, or too many file jobs running at once. Wait `retry_after` seconds. Codes: `rate_limited`, `too_many_batches`.'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Recommended: `Authorization: Bearer <key>`.'
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Alternative header form, for clients that cannot set `Authorization`. Keys are never read from the query string or the request body.
